name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so the price list (/cjenik) is republished every morning before 8:00 Zagreb
  # time, as NN 101/2026 requires even when nothing changed. 02:30 UTC (03:30 or 04:30 in
  # Zagreb) leaves room for GitHub's scheduling delays; each list is as of 03:00.
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Anchor prices and past price lists are read from git history (src/lib/priceHistory.ts)
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized WebP copies of the product photos (integrations/optimize-images.mjs); only new
      # or changed photos are processed when this is restored
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/gsbj-images
          key: images-${{ hashFiles('public/images/**') }}
          restore-keys: images-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
